# Asks Instagram whether its API takes a time to publish at, by creating three
# Reel containers (one with scheduled_publish_time) and reading them back.
# NEVER publishes: media_publish is not called, no video is uploaded, and Meta
# expires the containers after 24 hours. Run by hand from the Actions tab.
#
# Secrets are only ever read by manually started runs on this repository:
# no pull_request trigger, so no code from a fork runs with them. Actions are
# pinned to commit SHAs, so a moved tag can't run new code with them.
name: Instagram schedule probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run instagram:schedule-probe
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: '17841460482864126'
