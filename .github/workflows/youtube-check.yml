# Read-only check that the stored YouTube token belongs to the expected channel.
# Run by hand from the Actions tab. It posts nothing.
#
# Secrets are only ever read by manually started runs on this repository:
# no pull_request trigger, so no code from a fork runs with them.
name: YouTube check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run youtube:check
        env:
          YOUTUBE_CHANNEL_ID: UCM5CkEQSp4ZGycOq7d_MScw
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
