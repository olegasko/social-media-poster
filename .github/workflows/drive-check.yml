# Read-only check that the Drive service account can read the media folder.
# Run by hand from the Actions tab. It downloads nothing.
#
# Secrets are only ever read by manually started runs on this repository:
# no pull_request trigger, so no code from a fork runs with them.
name: Drive check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run drive:check
        env:
          # "Tuppin social", shared with the service account as Viewer.
          GDRIVE_FOLDER_ID: 1euivocgVvZjFOm0IhxDpd1UwsDVaSwkO
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
